name: scan-security

# Private-repo overlay: deeper SAST and vulnerability checks for Go modules.
# Secret scanning (gitleaks) is governance-wide and lives in job-gitleaks.yaml,
# so it is NOT duplicated here. This overlay is composed in only for --private.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-security:
    name: go security (gosec, govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
      - name: govulncheck
        if: ${{ hashFiles('go.mod') != '' }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec
        if: ${{ hashFiles('go.mod') != '' }}
        uses: securego/gosec@master
        with:
          args: ./...
